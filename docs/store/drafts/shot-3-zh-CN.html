<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_base.css" />
<style>
  .stage { flex-direction: column; }
  .head { max-width: 900px; margin-top: 8px; }
  .head h1 { margin-bottom: 14px; }
  .head .sub { max-width: 680px; }
  .flow { flex: 1; display: flex; align-items: center; justify-content: center; gap: 0; margin-top: 4px; position: relative; }

  /* desktop window */
  .laptop { width: 560px; }
  .screen { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; }
  .screen .top { height: 34px; background: var(--surface-2); display: flex; align-items: center; gap: 6px; padding: 0 14px; }
  .screen .top i { width: 9px; height: 9px; border-radius: 50%; background: #c7cdd6; }
  .mini { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .mcard { border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 10px; padding: 10px 12px; }
  .mcard.teal { border-left-color: var(--teal); }
  .mcard .h { font-size: 13.5px; font-weight: 700; }
  .mcard .m { font-size: 11px; color: var(--text-3); margin-left: 6px; font-weight: 500; }
  .mrow { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  .mrow i { width: 12px; height: 12px; border-radius: 3px; }
  .mrow span { font-size: 12px; color: var(--text-2); }

  /* sync link */
  .link { width: 150px; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 2; }
  .gist { display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow); }
  .gist .gh { font-size: 22px; }
  .gist .gt { font-size: 12.5px; font-weight: 700; }
  .gist .gs { font-size: 10.5px; color: var(--text-3); }
  .dashes { color: var(--accent); font-size: 20px; letter-spacing: 2px; }

  /* phone */
  .phone { width: 210px; height: 420px; background: #11151c; border-radius: 34px; padding: 10px; box-shadow: var(--shadow-lg); }
  .pscreen { width: 100%; height: 100%; background: var(--bg); border-radius: 25px; overflow: hidden; position: relative; }
  .pnotch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 70px; height: 18px; background: #11151c; border-radius: 10px; }
  .ptop { padding: 26px 14px 10px; font-size: 13px; font-weight: 800; }
  .ptop small { display: block; font-size: 9.5px; font-weight: 600; color: var(--text-3); letter-spacing: .04em; }
  .pcard { margin: 6px 12px; background: var(--surface); border-radius: 10px; border-left: 3px solid var(--accent); padding: 8px 10px; box-shadow: var(--shadow); }
  .pcard.teal { border-left-color: var(--teal); }
  .pcard .ph { font-size: 11.5px; font-weight: 700; }
  .pcard .pr { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .pcard .pr i { width: 9px; height: 9px; border-radius: 2px; }
  .pcard .pr span { font-size: 10px; color: var(--text-2); }

  .badges { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; }
  .badge { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); font-size: 14px; font-weight: 600; color: var(--text-2); }
  .badge b { color: var(--text); }
  .check { color: var(--teal); font-weight: 800; }
</style>
</head>
<body>
<div class="stage">
  <img class="wordmark" src="../../../public/icons/wordmark-transparent.png" alt="" />
  <div class="head">
    <h1>无需账户即可同步。</h1>
    <div class="sub">无需注册，也没有我们的服务器。你的列表存放在你<span class="accent">自己</span>的私有 GitHub gist 中——还能在手机上打开。</div>
  </div>
  <div class="flow">
    <div class="laptop">
      <div class="screen">
        <div class="top"><i></i><i></i><i></i></div>
        <div class="mini">
          <div class="mcard"><span class="h">阅读列表</span><span class="m">6 个标签页</span>
            <div class="mrow"><i style="background:#111"></i><span>2026 年最佳的 4 款站立式办公桌</span></div>
            <div class="mrow"><i style="background:#3a6ea5"></i><span>站立式办公桌 — 维基百科</span></div>
          </div>
          <div class="mcard teal"><span class="h">研究</span><span class="m">3 个标签页 · 已固定</span>
            <div class="mrow"><i style="background:#ff4500"></i><span>人体工学办公桌布置</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="link">
      <div class="dashes">┈┈┈</div>
      <div class="gist">
        <div class="gh">🔒</div>
        <div class="gt">你的 gist</div>
        <div class="gs">github.com</div>
      </div>
      <div class="dashes">┈┈┈</div>
    </div>

    <div class="phone">
      <div class="pscreen">
        <div class="pnotch"></div>
        <div class="ptop">Better Tab Manager<small>移动查看器</small></div>
        <div class="pcard"><div class="ph">阅读列表</div>
          <div class="pr"><i style="background:#111"></i><span>最佳站立式办公桌</span></div>
          <div class="pr"><i style="background:#3a6ea5"></i><span>站立式办公桌 — 维基</span></div>
        </div>
        <div class="pcard teal"><div class="ph">研究</div>
          <div class="pr"><i style="background:#ff4500"></i><span>人体工学布置</span></div>
        </div>
      </div>
    </div>
  </div>
  <div class="badges">
    <span class="badge"><span class="check">✓</span> 无需注册</span>
    <span class="badge"><span class="check">✓</span> 没有我们的服务器</span>
    <span class="badge"><span class="check">✓</span> <b>数据归你所有</b></span>
  </div>
</div>
</body>
</html>
